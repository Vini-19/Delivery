<div class="container mt-div">
  <button class="btn btn-success mb-2" routerLink="/Inicio/CrearOden">
    Agregar Pedido
  </button>
  <div class="row row-cols-1 row-cols-md-3 g-4">

    <div class="col">
      <div class="card">
        <img src="img/cocina.png" class="card-img-top card-img" alt="Pedidos de cocina">

        <div class="card-body">
          <h5 class="card-title">Pedidos Cocina</h5>

          <button type="button" class="btn btn-primary mb-3" routerLink="/Inicio/PedidosCocina">
            Ver Pedidos Cocina
          </button>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <img src="img/Delivery.jpg" class="card-img-top card-img" alt="Pedidos delivery">

        <div class="card-body">
          <h5 class="card-title">Pedidos Delivery</h5>

          <button type="button" class="btn btn-primary mb-3" routerLink="/Inicio/PedidosDelivery">
            Ver Pedidos Delivery
          </button>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <img src="img/libreta.png" class="card-img-top card-img" alt="Registro de pedidos">

        <div class="card-body">
          <h5 class="card-title">Registro de Pedidos</h5>

          <button type="button" class="btn btn-primary mb-3" routerLink="/Inicio/RegistroPedidos">
            Registrar Pedido
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
