services:
  broker:
    image: apache/kafka:4.3.1
    container_name: delivery-kafka
    hostname: broker
    restart: unless-stopped

    ports:
      - "9002:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:9092,EXTERNAL://localhost:9002
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - delivery_kafka_data:/var/lib/kafka/data

    networks:
      - delivery-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: delivery-kafka-init
    restart: "no"

    depends_on:
      broker:
        condition: service_healthy

    command:
      - /bin/bash
      - -c
      - |
        echo "Creando el topic pedidos-delivery..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server broker:9092 \
          --create \
          --if-not-exists \
          --topic pedidos-delivery \
          --partitions 3 \
          --replication-factor 1

        echo "Topics disponibles:"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server broker:9092 \
          --list

    networks:
      - delivery-network

  mongo:
    image: mongo:8.0
    container_name: delivery-mongo
    hostname: mongo
    restart: unless-stopped

    ports:
      - "27018:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Mongo123456
      MONGO_INITDB_DATABASE: delivery

    volumes:
      - delivery_mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

    networks:
      - delivery-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host localhost --port 27017 --username admin --password Mongo123456 --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  delivery-network:
    driver: bridge

volumes:
  delivery_kafka_data:
  delivery_mongo_data: